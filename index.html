<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiroyuki Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:'Montserrat', sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  text-align:center;
}

.container{
  width:90%;
  max-width:1100px;
}

.hero-image{
  width:420px;
  max-width:90%;
  border-radius:30px;
  border:6px solid #ffcc00;
  box-shadow:0 0 40px rgba(255,204,0,0.7);
  margin-bottom:2.5rem;
}

.title{
  font-size:4rem;
  line-height:1.1;
}

.title span:nth-child(1){
  font-family:'Bebas Neue', sans-serif;
  color:#ffcc00;
  letter-spacing:4px;
}

.title span:nth-child(2){
  font-family:'Playfair Display', serif;
  color:#ffffff;
  font-style:italic;
}

.title span:nth-child(3){
  font-family:'Montserrat', sans-serif;
  color:#ffcc00;
  font-weight:700;
}

.subtitle{
  margin-top:1.5rem;
  font-size:1rem;
  color:#ccc;
  letter-spacing:2px;
}

@media(max-width:768px){
  .title{font-size:2.5rem}
  .hero-image{width:280px}
}

</style>
</head>

<body>

<div class="container">
  <img src="Trio.png" alt="Hiroyuki Image" class="hero-image">
  
  <h1 class="title">
    <span>HIROYUKI</span> 
    <span>Portfolio</span>
  </h1>

  <p class="subtitle">ART • VISUAL • CREATIVE</p>
</div>

</body>
</html>
