<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiroyuki Portfolio - Home</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* Dripping Slime Header */
.slime-header{
  position:relative;
  background:#FFD700;
  height:180px;
  overflow:hidden;
}

.slime-header::after{
  content:"";
  position:absolute;
  bottom:-40px;
  left:0;
  width:100%;
  height:120px;
  background:#FFD700;
  border-radius:0 0 50% 50%;
}

.drip{
  position:absolute;
  bottom:-60px;
  width:120px;
  height:120px;
  background:#FFD700;
  border-radius:50%;
}

.drip1{left:10%;}
.drip2{left:30%; width:90px; height:90px;}
.drip3{left:55%; width:140px; height:140px;}
.drip4{left:80%; width:100px; height:100px;}

.hero{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  min-height:calc(100vh - 180px);
  padding:2rem;
}

.hero h1{
  font-size:3rem;
  color:#FFD700;
  margin-bottom:1.5rem;
}

.hero img{
  width:220px;
  max-width:80%;
  border-radius:20px;
  border:3px solid #FFD700;
}

@media(max-width:768px){
  .hero h1{font-size:2rem;}
}
</style>
</head>
<body>

<header class="slime-header">
  <div class="drip drip1"></div>
  <div class="drip drip2"></div>
  <div class="drip drip3"></div>
  <div class="drip drip4"></div>
</header>

<section class="hero">
  <h1>Hiroyuki Portfolio</h1>
  <img src="images/profile.jpg" alt="Hiroyuki Image">
</section>

<script src="js/script.js"></script>
</body>
</html>
