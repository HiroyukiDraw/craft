<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiroyuki Portfolio - Home</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}

/* CHEEZY SLIME HEADER */
.slime-header{
  position:relative;
  background:#ffcc00; /* cheezy yellow */
  height:220px;
}

/* Create gooey dripping bottom using blobs */
.slime-header::after{
  content:"";
  position:absolute;
  bottom:-70px;
  left:0;
  width:100%;
  height:150px;
  background:#ffcc00;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
}

.blob{
  position:absolute;
  bottom:-90px;
  background:#ffcc00;
  border-radius:50%;
}

.blob1{left:5%;width:140px;height:140px;}
.blob2{left:20%;width:100px;height:100px;}
.blob3{left:40%;width:160px;height:160px;}
.blob4{left:65%;width:120px;height:120px;}
.blob5{left:85%;width:150px;height:150px;}

/* HERO SECTION */
.hero{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  min-height:calc(100vh - 220px);
  padding:2rem;
}

.hero h1{
  font-size:3.5rem;
  color:#ffcc00;
  margin-bottom:2rem;
  letter-spacing:2px;
}

.hero img{
  width:250px;
  max-width:80%;
  border-radius:30px;
  border:4px solid #ffcc00;
  box-shadow:0 0 25px rgba(255,204,0,0.6);
}

@media(max-width:768px){
  .hero h1{font-size:2.2rem}
}
</style>
</head>

<body>

<header class="slime-header">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="blob blob4"></div>
  <div class="blob blob5"></div>
</header>

<section class="hero">
  <h1>Hiroyuki Portfolio</h1>
  <img src="images/profile.jpg" alt="Hiroyuki Image">
</section>

</body>
</html>
