<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiroyuki Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  font-family:'Montserrat',sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  overflow:hidden;

  /* Dark designed background */
  background:
    radial-gradient(circle at 20% 30%, rgba(255,204,0,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,204,0,0.06) 0%, transparent 40%),
    linear-gradient(135deg,#0a0a0a,#111,#000);
}

.container{
  width:90%;
  max-width:1100px;
}

/* Floating PNG Image */
.hero-image{
  width:420px;
  max-width:85%;
  margin-bottom:2rem;

  /* Floating effect */
  filter: drop-shadow(0 40px 40px rgba(0,0,0,0.8))
          drop-shadow(0 0 25px rgba(255,204,0,0.6));
}

/* Text Styling */
.title{
  line-height:1;
  margin-bottom:2rem;
}

.title .top{
  display:block;
  font-family:'Bebas Neue',sans-serif;
  font-size:4.5rem;
  letter-spacing:6px;
  color:#ffcc00;
}

.title .bottom{
  display:block;
  font-family:'Playfair Display',serif;
  font-size:3rem;
  font-style:italic;
  color:#ffffff;
  margin-top:0.5rem;
}

/* ENTER Button */
.enter-btn{
  margin-top:1.5rem;
  padding:0.9rem 2.5rem;
  font-size:1rem;
  font-weight:700;
  letter-spacing:3px;
  border:none;
  cursor:pointer;
  background:#ffcc00;
  color:#000;
  border-radius:40px;
  transition:0.3s ease;
  box-shadow:0 10px 25px rgba(255,204,0,0.4);
}

.enter-btn:hover{
  background:#fff;
  transform:translateY(-5px);
}

@media(max-width:768px){
  .hero-image{width:280px}
  .title .top{font-size:2.8rem}
  .title .bottom{font-size:2rem}
}

</style>
</head>

<body>

<div class="container">

  <img src="images/profile.png" alt="Hiroyuki Image" class="hero-image">

  <h1 class="title">
    <span class="top">HIROYUKI</span>
    <span class="bottom">Portfolio</span>
  </h1>

  <button class="enter-btn" onclick="window.location.href='about.html'">ENTER</button>

</div>

</body>
</html>
