<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiroyuki Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@900&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  font-family:'Montserrat',sans-serif;
  color:#fff;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,204,0,0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(255,204,0,0.06) 0%, transparent 40%),
    linear-gradient(135deg,#0a0a0a,#111,#000);
}

.container{
  width:95%;
  max-width:1600px;
  margin:auto;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* LEFT SIDE IMAGE */
.left{
  flex:1.3;
  display:flex;
  justify-content:flex-start; /* move more left */
  align-items:center;
}

.hero-image{
  width:100%;
  max-width:900px; /* bigger */
  transform:translateX(-5%); /* push slightly left */
  filter: drop-shadow(0 70px 70px rgba(0,0,0,0.9))
          drop-shadow(0 0 45px rgba(255,204,0,0.7));
}

/* RIGHT SIDE TEXT */
.right{
  flex:1;
  text-align:left;
}

.title{
  line-height:0.85;
  margin-bottom:3rem;
}

.title .top{
  display:block;
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(6rem, 9vw, 11rem);
  letter-spacing:10px;
  color:#ffcc00;
}

/* Portfolio styled like reference image */
.title .bottom{
  display:block;
  font-family:'Playfair Display',serif;
  font-weight:900;
  font-size:clamp(4rem, 6vw, 7rem);
  color:#f5f5f5;
  margin-top:1rem;
  letter-spacing:3px;

  /* Thick outline */
  -webkit-text-stroke:3px #111;

  /* Strong shadow for vintage look */
  text-shadow:
    4px 4px 0 #000,
    8px 8px 20px rgba(0,0,0,0.8);
}

.enter-btn{
  margin-top:2rem;
  padding:1rem 3.5rem;
  font-size:1.2rem;
  font-weight:700;
  letter-spacing:4px;
  border:none;
  cursor:pointer;
  background:#ffcc00;
  color:#000;
  border-radius:50px;
  transition:0.3s ease;
  box-shadow:0 15px 30px rgba(255,204,0,0.5);
}

.enter-btn:hover{
  background:#fff;
  transform:translateY(-6px);
}

/* Responsive */
@media(max-width:900px){
  .container{
    flex-direction:column;
    text-align:center;
  }

  .right{text-align:center}

  .hero-image{
    max-width:450px;
    transform:none;
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="left">
    <img src="Trio.png" alt="Hiroyuki Image" class="hero-image">
  </div>

  <div class="right">
    <h1 class="title">
      <span class="top">HIROYUKI</span>
      <span class="bottom">Portfolio</span>
    </h1>

    <button class="enter-btn" onclick="window.location.href='about.html'">ENTER</button>
  </div>

</div>

</body>
</html>
