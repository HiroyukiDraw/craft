<!DOCTYPE html>
<html>
<head>
<title>Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:#fff;line-height:1.6}
header{background:#000;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:1000}
.container{width:90%;max-width:1200px;margin:auto}
nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 0}
.logo{color:#FFD700;font-weight:700;font-size:1.5rem}
.nav-links{display:flex;gap:1.5rem}
.nav-links a{text-decoration:none;color:#fff;transition:.3s}
.nav-links a:hover{color:#FFD700}
.menu-toggle{display:none;color:#FFD700;font-size:1.5rem;cursor:pointer}
section{padding:4rem 0;min-height:100vh}
h1,h2{color:#FFD700;margin-bottom:1rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem}
.card{background:#111;border:1px solid #FFD700;padding:1rem;border-radius:10px;transition:.3s}
.card:hover{transform:translateY(-5px)}
.btn{background:#FFD700;color:#000;padding:.6rem 1.2rem;border:none;border-radius:20px;cursor:pointer;font-weight:600}
footer{text-align:center;padding:1rem;border-top:2px solid #FFD700}
.filter-buttons{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin-bottom:2rem}
.filter-buttons button{background:transparent;border:2px solid #FFD700;color:#FFD700;padding:.4rem 1rem;border-radius:20px;cursor:pointer}
.filter-buttons button.active,.filter-buttons button:hover{background:#FFD700;color:#000}
@media(max-width:768px){.nav-links{display:none;flex-direction:column;background:#000;position:absolute;top:60px;right:0;width:200px;padding:1rem}
.nav-links.show{display:flex}
.menu-toggle{display:block}}
</style>
</head>
<body>
<header>
<div class="container">
<nav>
<div class="logo">My Portfolio</div>
<div class="menu-toggle" onclick="toggleMenu()">☰</div>
<div class="nav-links" id="navLinks">
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="works.html">Works</a>
<a href="skills.html">Skills</a>
<a href="experience.html">Experience</a>
<a href="contact.html">Contact</a>
</div>
</nav>
</div>
</header>
<section>
<div class="container">
<h1>Creative Art Student</h1>
<p style="text-align:center">Welcome to my black and yellow themed portfolio.</p>
<br>
<div style="text-align:center"><a href="works.html"><button class="btn">View My Works</button></a></div>
</div>
</section>
<footer>© 2026 My Portfolio</footer>
<script src="script.js"></script>
</body>
</html>
<script>
function toggleMenu(){document.getElementById('navLinks').classList.toggle('show')}
function filterSelection(category){const cards=document.querySelectorAll('.card');const buttons=document.querySelectorAll('.filter-buttons button');buttons.forEach(btn=>btn.classList.remove('active'));event.target.classList.add('active');cards.forEach(card=>{if(category==='all'){card.style.display='block'}else{card.style.display=card.classList.contains(category)?'block':'none'}})}
</script>
