<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works - Joshua (Hiroyuki)</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Montserrat',sans-serif;
  background:#000;
  color:#fff;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:25px;
  padding:20px 0;
  background:#000;
  z-index:1000;
}

nav a{
  text-decoration:none;
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;
  letter-spacing:3px;
  padding:10px 25px;
  border:2px solid #ffcc00;
  color:#ffcc00;
  transition:0.3s;
}

nav a:hover{
  background:#ffcc00;
  color:#000;
  transform:translateY(-5px);
  box-shadow:0 0 20px #ffcc00;
}

.container{
  padding:140px 8% 80px;
  max-width:1400px;
  margin:auto;
}

.title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4rem,7vw,7rem);
  letter-spacing:8px;
  color:#ffcc00;
  margin-bottom:3rem;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* FILTER BUTTONS */
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:3rem;
}

.filter-btn{
  padding:10px 20px;
  border:2px solid #ffcc00;
  background:#000;
  color:#ffcc00;
  cursor:pointer;
  font-weight:700;
  transition:0.3s;
}

.filter-btn:hover,
.filter-btn.active{
  background:#ffcc00;
  color:#000;
}

/* GRID - SAME SIZE FRAME */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.work-card{
  position:relative;
  overflow:hidden;
  cursor:pointer;
  aspect-ratio:1/1; /* PERFECT SQUARE FRAME */
}

.work-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:0.4s;
}

.work-card:hover img{
  transform:scale(1.1);
  opacity:0.8;
}

.work-label{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.8);
  padding:15px;
  font-weight:700;
  letter-spacing:2px;
  text-align:center;
}

.hidden{display:none}

/* LIGHTBOX */
.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:2000;
}

.lightbox img{
  max-width:90%;
  max-height:80vh;
  margin-bottom:20px;
}

.lightbox-controls{
  display:flex;
  gap:20px;
}

.lb-btn{
  padding:10px 25px;
  border:2px solid #ffcc00;
  background:#000;
  color:#ffcc00;
  cursor:pointer;
  font-weight:700;
}

.lb-btn:hover{
  background:#ffcc00;
  color:#000;
}

.close-btn{
  position:absolute;
  top:30px;
  right:40px;
  font-size:2rem;
  color:#ffcc00;
  cursor:pointer;
}

</style>
</head>

<body>

<nav>
  <a href="index.html">HOME</a>
  <a href="about.html">ABOUT</a>
  <a href="works.html">WORKS</a>
  <a href="contact.html">CONTACT</a>
</nav>

<div class="container">

  <div class="title">MY WORKS</div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterSelection('all', event)">ALL</button>
    <button class="filter-btn" onclick="filterSelection('videos', event)">VIDEOS</button>
    <button class="filter-btn" onclick="filterSelection('digital', event)">DIGITAL ART</button>
    <button class="filter-btn" onclick="filterSelection('traditional', event)">TRADITIONAL ART</button>
    <button class="filter-btn" onclick="filterSelection('crafts', event)">CRAFTS</button>
    <button class="filter-btn" onclick="filterSelection('graphics', event)">GRAPHICS</button>
  </div>

    <div class="grid" id="gallery">

    <div class="work-card videos">
      <img src="images/sample1.jpg" onclick="openLightbox(0)">
      <div class="work-label">Music Video</div>
    </div>

    <div class="work-card digital">
      <img src="HiroDiary.png" onclick="openLightbox(1)">
      <div class="work-label">Digital Art</div>
    </div>

      <div class="work-card digital">
      <img src="JAHMIJ.png" onclick="openLightbox(1)">
      <div class="work-label">Digital Art</div>
    </div>

      <div class="work-card digital">
      <img src="ProdOC.png" onclick="openLightbox(1)">
      <div class="work-label">Digital Art</div>
    </div>

    <div class="work-card traditional">
      <img src="images/sample3.jpg" onclick="openLightbox(2)">
      <div class="work-label">Traditional Art</div>
    </div>

    <div class="work-card crafts">
      <img src="images/sample4.jpg" onclick="openLightbox(3)">
      <div class="work-label">Craft</div>
    </div>

    <div class="work-card graphics">
      <img src="images/sample5.jpg" onclick="openLightbox(4)">
      <div class="work-label">Graphics</div>
    </div>

  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close-btn" onclick="closeLightbox()">✕</span>
  <img id="lightbox-img">
  <div class="lightbox-controls">
    <button class="lb-btn" onclick="prevImage()">PREVIOUS</button>
    <button class="lb-btn" onclick="nextImage()">NEXT</button>
  </div>
</div>

<script>
let currentIndex = 0;

function filterSelection(category, event){
  let cards=document.getElementsByClassName('work-card');
  let buttons=document.getElementsByClassName('filter-btn');

  for(let btn of buttons){btn.classList.remove('active');}
  if(event) event.target.classList.add('active');

  for(let card of cards){
    card.classList.remove('hidden');
    if(category!=='all' && !card.classList.contains(category)){
      card.classList.add('hidden');
    }
  }
}

function openLightbox(index){
  const images=document.querySelectorAll('.work-card img');
  currentIndex=index;
  document.getElementById('lightbox-img').src=images[currentIndex].src;
  document.getElementById('lightbox').style.display='flex';
}

function closeLightbox(){
  document.getElementById('lightbox').style.display='none';
}

function nextImage(){
  const images=document.querySelectorAll('.work-card img');
  currentIndex=(currentIndex+1)%images.length;
  document.getElementById('lightbox-img').src=images[currentIndex].src;
}

function prevImage(){
  const images=document.querySelectorAll('.work-card img');
  currentIndex=(currentIndex-1+images.length)%images.length;
  document.getElementById('lightbox-img').src=images[currentIndex].src;
}
</script>

</body>
</html>
