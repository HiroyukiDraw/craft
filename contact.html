<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Joshua (Hiroyuki)</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Montserrat',sans-serif;
  background:linear-gradient(135deg,#000 60%, #111 100%);
  color:#fff;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:25px;
  padding:20px 0;
  background:#000;
  z-index:1000;
}

nav a{
  text-decoration:none;
  font-family:'Bebas Neue',sans-serif;
  font-size:1.1rem;
  letter-spacing:3px;
  padding:10px 25px;
  border:2px solid #ffcc00;
  color:#ffcc00;
  transition:0.3s;
}

nav a:hover{
  background:#ffcc00;
  color:#000;
  transform:translateY(-5px);
  box-shadow:0 0 20px #ffcc00;
}

.container{
  padding:150px 8% 80px;
  max-width:1200px;
  margin:auto;
  text-align:center;
}

.title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(4rem,8vw,7rem);
  letter-spacing:8px;
  color:#ffcc00;
  margin-bottom:3rem;
}

.contact-wrapper{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  margin-top:40px;
}

/* LEFT INFO */
.contact-info{
  text-align:left;
}

.contact-info h2{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.5rem;
  letter-spacing:3px;
  margin-bottom:20px;
  color:#ffcc00;
}

.contact-info p{
  font-size:1.2rem;
  line-height:1.8;
  margin-bottom:15px;
}

.socials{
  margin-top:25px;
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.socials a{
  text-decoration:none;
  padding:10px 20px;
  border:2px solid #ffcc00;
  color:#ffcc00;
  font-weight:700;
  transition:0.3s;
}

.socials a:hover{
  background:#ffcc00;
  color:#000;
  box-shadow:0 0 15px #ffcc00;
}

/* FORM */
.contact-form{
  background:#111;
  padding:40px;
  border:2px solid #ffcc00;
}

.contact-form input,
.contact-form textarea{
  width:100%;
  padding:15px;
  margin-bottom:20px;
  background:#000;
  border:2px solid #333;
  color:#fff;
  font-size:1rem;
}

.contact-form input:focus,
.contact-form textarea:focus{
  border-color:#ffcc00;
  outline:none;
}

.contact-form button{
  width:100%;
  padding:15px;
  font-family:'Bebas Neue',sans-serif;
  font-size:1.3rem;
  letter-spacing:3px;
  border:2px solid #ffcc00;
  background:#000;
  color:#ffcc00;
  cursor:pointer;
  transition:0.3s;
}

.contact-form button:hover{
  background:#ffcc00;
  color:#000;
  box-shadow:0 0 20px #ffcc00;
}

.footer-sign{
  margin-top:60px;
  font-family:'Bebas Neue',sans-serif;
  font-size:1.5rem;
  letter-spacing:4px;
  color:#ffcc00;
}

@media(max-width:900px){
  .contact-wrapper{
    grid-template-columns:1fr;
  }
  .contact-info{
    text-align:center;
  }
}

</style>
</head>

<body>

<nav>
  <a href="index.html">HOME</a>
  <a href="about.html">ABOUT</a>
  <a href="works.html">WORKS</a>
  <a href="contact.html">CONTACT</a>
</nav>

<div class="container">

  <div class="title">CONTACT ME</div>

  <div class="contact-wrapper">

    <div class="contact-info">
      <h2>LET'S WORK TOGETHER</h2>
      <p>If you want to collaborate, commission artwork, or ask questions, feel free to message me.</p>
      <p><strong>Email:</strong> hiroyuki.draw@gmail.com</p>
      <p><strong>Location:</strong> Philippines</p>

      <div class="socials">
        <a href="https://www.facebook.com/juswawawa069">FACEBOOK</a>
        <a href="https://www.instagram.com/jusmac_88?igsh=MTZtYjM5bzh2ajhzcA==">INSTAGRAM</a>
        <a href="https://vm.tiktok.com/ZSmNMUaRF/">TIKTOK</a>
      </div>
    </div>

    <div class="contact-form">
      <form target="_blank" action="https://formsubmit.co/hiroyuki.draw@gmail.com" method="POST">
        
        <input type="hidden" name="_captcha" value="false">

        <input type="text" name="name" placeholder="FULL NAME" required>
        <input type="email" name="email" placeholder="EMAIL ADDRESS" required>
        <textarea name="message" rows="6" placeholder="YOUR MESSAGE" required></textarea>
        
        <button type="submit">SEND MESSAGE</button>
      </form>
    </div>

  </div>

  <div class="footer-sign">— Joshua (Hiroyuki)</div>

</div>

</body>
</html>
